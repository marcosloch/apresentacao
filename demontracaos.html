<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="demontracaos.css">
    <title>Demontrações de Pseudo-Classes</title>
</head>
<body>
    <header>
        <h1>Demontrações de Pseudo-Classes</h1>
        <p>feito por: Cláudio, Marcos, Ricardo</p>
    </header>
    <main>
        <h1>demontração de hover</h1>

        <div>
            <h2 class="hover">hover</h2>
        </div>
        <br>

        <h1>demontração de focus</h1>

        <div>
            <input class="focus" value="focus">
        </div>
        <br>

        <h1>demontração de active</h1>

        <div>
            <h2 class="active">active</h2>
        </div>
        <br>

        <h1>demontração de link</h1>

        <div>
            <a class="link" href="https://github.com/marcosloch/apresentacao" >link</a>
        </div>
        <br>

        <h1>demontração de visited</h1>

        <div>
            <a class="visited" href="https://github.com/marcosloch/apresentacao" >visited</a>
        </div>
        <br>

    </main>
</body>
</html>
